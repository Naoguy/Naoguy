name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    # The bpy-free core is the bulk of the logic and needs no Blender, so it
    # runs on plain Python in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  blender:
    # End-to-end run against a real Blender via the bpy module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bpy
      - run: python tests/smoke_blender.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: pcb-generator-extension
          path: dist/*.zip
